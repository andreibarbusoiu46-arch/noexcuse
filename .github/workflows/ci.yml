# Checks every pull request and every push to main. Read-only: it never deploys, never touches the production
# Supabase project and needs no secrets. Database tests run against a throwaway Postgres container.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      # Demo build: no backend values needed, and nothing is published.
      - run: npx expo export -p web --output-dir dist && node scripts/web-landing.mjs
        env:
          EXPO_PUBLIC_DEMO: "1"

  functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env --allow-read=supabase/functions/tests/fixtures --no-lock --node-modules-dir=none supabase/functions/tests

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run.sh

  e2e:
    name: End-to-end journeys and route sweep (demo build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Demo mode: in-memory data, no backend, no secrets.
      - run: npx expo export -p web --output-dir /tmp/nx-demo
        env:
          EXPO_PUBLIC_DEMO: "1"
      - run: |
          node e2e/serve.cjs /tmp/nx-demo 8095 &
          sleep 1
          node e2e/journeys.cjs http://localhost:8095 /tmp/nx-e2e
          node e2e/sweep.cjs http://localhost:8095 /tmp/nx-e2e ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: /tmp/nx-e2e
